<script>
  document.querySelectorAll('.social-icon').forEach(icon => {
    icon.addEventListener('click', () => {
      icon.style.background = '#f7e6ea';
      icon.style.transform = 'scale(1)';
    });
  });

  const sections = document.querySelectorAll("section");
  const navLinks = document.querySelectorAll("nav a");
let isInitialLoad = true;

  window.addEventListener("DOMContentLoaded", () => {
  const hash = window.location.hash;

  navLinks.forEach(l => l.classList.remove("active"));

  if (hash) {
    const targetLink = document.querySelector(`nav a[href="${hash}"]`);
    if (targetLink) {
      targetLink.classList.add("active");
    }
  } else {

    const homeLink = document.querySelector('nav a[href="#home"]');
    if (homeLink) {
      homeLink.classList.add("active");
    }
  }

  setTimeout(() => {
    isInitialLoad = false;
  }, 500);
});

  let isClickScrolling = false;

  navLinks.forEach(link => {
  link.addEventListener("click", (e) => {
    const href = link.getAttribute("href");

    if (
      href === "#home" &&
      (window.location.hash === "" || window.location.hash === "#home")
    ) {
      e.preventDefault();
      return;
    }

    if (href.startsWith("#")) {
      isClickScrolling = true;

      navLinks.forEach(l => l.classList.remove("active"));
      link.classList.add("active");

      setTimeout(() => {
        isClickScrolling = false;
      }, 600);
    }
  });
});

  window.addEventListener("scroll", () => {
  if (isClickScrolling || isInitialLoad) return;

  if (window.scrollY < 100) {
    navLinks.forEach(link => link.classList.remove("active"));
    document.querySelector('nav a[href="#home"]').classList.add("active");
    return;
  }

  let current = "";

  sections.forEach(section => {
    const rect = section.getBoundingClientRect();

    if (rect.top <= 185 && rect.bottom >= 180) {
      current = section.id;
    }
  });

  navLinks.forEach(link => link.classList.remove("active"));

  if (current === "home" || current === "gallery") {
    document.querySelector('nav a[href="#home"]').classList.add("active");
  } 
  else if (current === "services") {
    document.querySelector('nav a[href="#services"]').classList.add("active");
  }
else if (current === "policy") {
    document.querySelector('nav a[href="#policy"]').classList.add("active");
  }
});
</script>
